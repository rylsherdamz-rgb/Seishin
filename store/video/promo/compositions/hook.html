<template>
  <style>
    #root { position: absolute; inset: 0; background: #0f0f11; font-family: "Outfit"; overflow: hidden; }
    #hook-lines { position: absolute; left: 0; right: 0; top: 330px; text-align: center; color: #f4f1ec; }
    .hook-line { font-size: 150px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; }
    .hook-w { display: inline-block; margin: 0 0.12em; }
    .hook-accent { color: #fb7185; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hook-lines" data-layout-allow-overflow>
      <div class="hook-line"><span class="hook-w">Your</span><span class="hook-w">whole</span><span class="hook-w">day.</span></div>
      <div class="hook-line"><span class="hook-w">One</span><span class="hook-w hook-accent">calm</span><span class="hook-w">app.</span></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const w = gsap.utils.toArray("#hook-lines .hook-w");
    w.forEach((el, i) => {
      const at = i < 3 ? 0.15 + i * 0.12 : 1.15 + (i - 3) * 0.12;
      tl.fromTo(el, { opacity: 0, filter: "blur(10px)", y: 0 }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, at);
    });
    // Whip up into the first product shot.
    tl.fromTo("#hook-lines", { y: 0, filter: "blur(0px)" }, { y: -700, filter: "blur(18px)", duration: 0.3, ease: "power3.in" }, 2.45);
    window.__timelines["hook"] = tl;
  </script>
</template>
