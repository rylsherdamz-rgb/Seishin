  <script>
    const tl = gsap.timeline({ paused: true });
    // Arrives from the left, still carrying the whip's blur.
    tl.fromTo("#tsk-phone", { x: -1300, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
    tl.fromTo("#tsk-kicker", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);

    });
    // Punch in on the add box before the keyboard rises; pull back once it's gone.
    tl.fromTo("#tsk-zoom", { scale: 1 }, { scale: 2.0, duration: 0.55, ease: "power2.inOut" }, 0.55);
    tl.to("#tsk-zoom", { scale: 1, duration: 0.55, ease: "power2.inOut" }, 7.05);
    // Chips land as the user reaches for one; "Tomorrow" lights with the real tap.

      tl.fromTo(id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.4)" }, 2.4 + i * 0.07);
